name: build-x86_64-mt7922-plus

on:
  workflow_dispatch:
  push:
    paths:
      - 'configs/x86_64-mt7922-plus.config'
      - 'package/custom/default-settings/**'
      - '.github/workflows/build-x86_64-mt7922-plus.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libncursesw5-dev libssl-dev python3-dev \
            python3-setuptools python3-pip python3-distutils rsync swig unzip \
            zlib1g-dev file wget subversion libelf-dev bc ccache libblkid-dev \
            libfdt-dev device-tree-compiler mtools dosfstools xorriso cpio zstd \
            liblzma-dev libbz2-dev libgmp-dev libmpc-dev texinfo help2man patch \
            pkg-config autoconf automake libtool-bin liblz4-dev libzstd-dev \
            libncurses-dev time

      - name: Update and install official feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add plus-ext third-party feeds and whitelist packages
        run: |
          if ! grep -q 'openwrt-passwall2' feeds.conf.default; then
            cat configs/feeds.plus-ext.conf >> feeds.conf.default
          fi
          ./scripts/feeds update -a
          ./scripts/feeds install $(tr '\n' ' ' < configs/packages.plus-ext.txt)

      - name: Configure
        run: |
          ./scripts/apply-cn-feed-patches.sh
          cp configs/x86_64-mt7922-plus.config .config
          make defconfig

      - name: Build firmware
        run: make -j"$(nproc)" V=0

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp -f bin/targets/x86/64/*.img.gz out/ 2>/dev/null || true
          cp -f bin/targets/x86/64/*.manifest out/ 2>/dev/null || true
          cp -f bin/targets/x86/64/sha256sums out/ 2>/dev/null || true
          ls -lh out

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-x86-64-mt7922-plus
          path: out/*
          retention-days: 30
